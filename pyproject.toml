[project]
name = "agent-eval-framework"
version = "0.1.0"
description = "Evaluate multi-agent LangGraph workflows with LLM-as-judge rubrics and OpenTelemetry tracing"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "anthropic>=0.70",
    "pydantic>=2",
    "pyyaml>=6",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp>=1.25",
    "psycopg[binary]>=3.1",
]

[project.scripts]
agent-eval = "agent_eval.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
